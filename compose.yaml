# Run it from the root of the package: `make test`, `make shell`. The repository is mounted at /app.
# The packages come from Packagist, phem/phem included: vendor/bin/phemc runs the phemc binary of
# the installed phem/phem release.
name: phem-ui-base

services:
  dev:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: vendor/bin/phpunit
    volumes:
      - .:/app

  # The browser tests of the demo (`make test-e2e`). Playwright PHP sends the requests of the
  # browser to the kernel of the demo, in the PHPUnit process, so no web server runs.
  e2e:
    build:
      context: .
      dockerfile: docker/e2e.Dockerfile
      additional_contexts: { dev: "service:dev" }
    working_dir: /app/demo
    command: bin/test
    # PHPUnit is the last process of bin/test: as PID 1, it would not stop on Ctrl-C.
    init: true
    volumes:
      - .:/app
